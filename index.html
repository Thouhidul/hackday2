<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SilentSpeak | Visual Cipher</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-mesh"></div>

    <header class="main-nav">
        <div class="logo-area" onclick="location.hash=''; location.reload();">
            <span class="logo-icon">🌐</span>
            <h1>SilentSpeak</h1>
        </div>
        <button id="btn-open-key" class="icon-btn-circle">🔑</button>
    </header>

    <div class="app-container">
        <section id="view-create" class="view active">
            <div class="canvas-wrapper">
                <span class="label-floating">Live Preview</span>
                <canvas id="preview-canvas"></canvas>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Emotion</label>
                    <div class="emotion-selector">
                        <button class="emotion-btn selected" data-emotion="serenity">🌊</button>
                        <button class="emotion-btn" data-emotion="joy">✨</button>
                        <button class="emotion-btn" data-emotion="rage">🔥</button>
                        <button class="emotion-btn" data-emotion="grief">🌑</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Intent Cipher</label>
                    <div class="intent-grid">
                        <button class="intent-btn" data-intent="MEET" title="Meet">🤝</button>
                        <button class="intent-btn" data-intent="OK" title="OK">👌</button>
                        <button class="intent-btn" data-intent="HELP" title="Help">🆘</button>
                        <button class="intent-btn" data-intent="SAFE" title="Safe">🏠</button>
                        <button class="intent-btn" data-intent="WAIT" title="Wait">⏳</button>
                        <button class="intent-btn" data-intent="CALL" title="Call">📞</button>
                        <button class="intent-btn" data-intent="FOOD" title="Food">🍕</button>
                        <button class="intent-btn" data-intent="SLEEP" title="Sleep">😴</button>
                    </div>
                </div>

                <div class="control-row">
                    <div class="control-group half">
                        <label>Intensity: <span id="intensity-val">50%</span></label>
                        <input type="range" id="intensity" min="0" max="100" value="50">
                    </div>
                    <div class="control-group half">
                        <label>Palette</label>
                        <select id="palette">
                            <option value="neon">Neon</option>
                            <option value="pastel">Pastel</option>
                            <option value="monochrome">Mono</option>
                            <option value="warm">Warm</option>
                        </select>
                    </div>
                </div>
                <button id="btn-randomize" class="secondary-btn">🎲 Randomize Seed</button>
            </div>
            <button id="btn-goto-encrypt" class="primary-btn">Next: Encrypt →</button>
        </section>

        <section id="view-encrypt" class="view hidden">
            <button class="back-btn" id="btn-back-create">← Back</button>
            <div class="card">
                <h2>Secure Message</h2>
                <div class="input-group">
                    <input type="password" id="encrypt-pass" placeholder="Passphrase">
                </div>
                <button id="btn-encrypt" class="primary-btn">🔒 Generate Link</button>
                <div id="share-result" class="hidden result-box">
                    <input type="text" id="share-link" readonly>
                    <button id="btn-copy">Copy Link</button>
                </div>
            </div>
        </section>

        <section id="view-decrypt" class="view hidden">
            <div id="decrypt-input-area">
                <h2>Unlock Message</h2>
                <input type="password" id="decrypt-pass" placeholder="Passphrase">
                <button id="btn-decrypt" class="primary-btn">🔓 Decrypt</button>
            </div>
            <div id="decrypt-display-area" class="hidden">
                <div class="canvas-wrapper"><canvas id="view-canvas"></canvas></div>
                <div class="summary-card">
                    <div class="res-item"><span>Emotion:</span> <span id="res-emotion"></span></div>
                    <div class="res-item"><span>Intent:</span> <span id="res-intent"></span></div>
                </div>
                <div class="interpretation-area">
                    <label>Save Your Interpretation</label>
                    <div class="emoji-feedback">
                        <button data-emoji="❤️">❤️</button><button data-emoji="🫂">🫂</button>
                        <button data-emoji="✅">✅</button><button data-emoji="❓">❓</button>
                        <button data-emoji="⚠️">⚠️</button><button data-emoji="🕊️">🕊️</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="modal-key" class="modal hidden">
        <div class="modal-content">
            <h3>Visual Dictionary</h3>
            <p>🌊 Serenity | ✨ Joy | 🔥 Rage | 🌑 Grief</p>
            <p>Marks at the bottom left represent the hidden intent.</p>
            <button id="btn-close-key">Close</button>
        </div>
    </div>
    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
