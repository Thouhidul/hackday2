<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentSpeak | Ether Cipher</title>
    <style>
        :root { --bg: #030303; --accent: #00ffcc; --surface: #0a0a0a; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        .app-container { max-width: 450px; margin: 0 auto; padding: 10px; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 15px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
        .canvas-wrapper { width: 100%; flex-grow: 1; min-height: 380px; background: #000; border-radius: 24px; border: 1px solid #222; margin-bottom: 10px; position: relative; box-shadow: 0 0 40px rgba(0,0,0,1); }
        canvas { width: 100%; height: 100%; display: block; border-radius: 24px; filter: contrast(1.1) brightness(1.2); }
        .controls { background: var(--surface); padding: 15px; border-radius: 24px; border: 1px solid #1a1a1a; }
        .section-label { font-size: 0.6rem; color: #444; text-transform: uppercase; margin: 5px 0; letter-spacing: 2px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 90px; overflow-y: auto; padding: 5px; }
        button { background: #000; border: 1px solid #222; color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        button.selected { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,255,204,0.3); transform: scale(1.1) translateY(-2px); background: #0a1a1a; }
        .primary-btn { width: 100%; background: var(--accent); color: #000; font-weight: bold; padding: 18px; border: none; border-radius: 18px; margin-top: 10px; font-size: 0.9rem; cursor: pointer; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; background: #000; border: 1px solid #222; color: #fff; border-radius: 12px; margin-bottom: 10px; outline: none; }
        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
        .summary-card { display: flex; align-items: center; justify-content: space-around; background: #000; padding: 20px; border-radius: 20px; border: 1px solid #1a1a1a; }
        #status { font-size: 0.6rem; color: var(--accent); opacity: 0.6; }
    </style>
</head>
<body>

    <header>
        <div onclick="location.hash=''; location.reload();" style="cursor:pointer; font-weight: bold; letter-spacing: 3px;">ETHER_CIPHER</div>
        <div id="status">● SYSTEM_READY</div>
    </header>

    <div class="app-container">
        <section id="view-create" class="view active">
            <div class="canvas-wrapper"><canvas id="preview-canvas"></canvas></div>
            <div class="controls">
                <div class="grid">
                    <button class="emo-btn selected" data-emo="serenity">🌊</button>
                    <button class="emo-btn" data-emo="joy">✨</button>
                    <button class="emo-btn" data-emo="rage">🔥</button>
                    <button class="emo-btn" data-emo="grief">🌑</button>
                </div>
                <div class="emoji-grid" id="intent-picker"></div>
                <input type="range" id="intensity" min="1" max="100" value="50" style="width:100%; accent-color:var(--accent); margin-top:10px;">
            </div>
            <button id="goto-encrypt" class="primary-btn">GENERATE ETHER LINK</button>
        </section>

        <section id="view-encrypt" class="view">
            <div class="controls" style="margin-top:20px;">
                <h3 style="text-align:center">Set Key</h3>
                <input type="text" id="pass-en" placeholder="Passphrase">
                <button id="do-encrypt" class="primary-btn">LOCK LINK</button>
                <div id="result-area" style="display:none; margin-top:20px;">
                    <input type="text" id="final-link" readonly style="font-size:0.7rem">
                    <button id="copy-btn" style="width:100%; background:#222; color:var(--accent)">COPY URL</button>
                </div>
            </div>
            <button onclick="switchView('create')" style="background:none; border:none; color:#444; margin-top:20px;">← Back to Visual</button>
        </section>

        <section id="view-decrypt" class="view">
            <div id="dec-input" class="controls" style="margin-top:50px;">
                <h3 style="text-align:center">Unlock Cipher</h3>
                <input type="text" id="pass-de" placeholder="Enter Key">
                <button id="do-decrypt" class="primary-btn">UNLOCK</button>
            </div>
            <div id="dec-output" style="display:none; height:100%; flex-direction:column;">
                <div class="canvas-wrapper"><canvas id="view-canvas"></canvas></div>
                <div class="summary-card">
                    <span id="res-emo" style="letter-spacing:2px; font-size:0.7rem"></span>
                    <span id="res-int" style="font-size:2.5rem"></span>
                </div>
                <button onclick="location.hash=''; location.reload();" class="primary-btn" style="background:#111; color:#fff;">NEW SESSION</button>
            </div>
        </section>
    </div>

    <script>
        const EMOJIS = ["🤝","👌","🆘","🏠","⏳","📞","🍕","😴","❤️","🏃","🚨","🎁","🫂","✅","❓","⚠️","🕊️","💪","🌈","📍","🔒","💰","🔥","🧊","💊","💬","💀","🤫","👀","🥂","🦋","🛸","🌌","🧬","🌹","💎"];
        const PALETTES = { 
            serenity:['#00f2ff','#7effd4','#0062ff'], 
            joy:['#ffd700','#ff00d4','#00ffcc'], 
            rage:['#ff3300','#ff0055','#ffffff'], 
            grief:['#6a00ff','#1a1a1a','#444444'] 
        };
        
        let state = { emo:'serenity', int:50, intent:'🤝', seed:Math.random() };

        // UI Initialization
        const picker = document.getElementById('intent-picker');
        EMOJIS.forEach(e => {
            const b = document.createElement('button');
            b.innerText = e;
            b.onclick = () => {
                document.querySelectorAll('#intent-picker button').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                state.intent = e;
            };
            if(e === '🤝') b.classList.add('selected');
            picker.appendChild(b);
        });

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        }

        document.querySelectorAll('.emo-btn').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.emo-btn').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                state.emo = b.dataset.emo;
            }
        });

        document.getElementById('intensity').oninput = (e) => state.int = e.target.value;
        document.getElementById('goto-encrypt').onclick = () => switchView('encrypt');

        // MAGICAL ANIMATION ENGINE (Harmonographs & Light Trails)
        function runAnim(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d', { alpha: false });
            let t = 0;

            function draw() {
                if (canvas.offsetParent === null) return requestAnimationFrame(draw);
                canvas.width = canvas.clientWidth * window.devicePixelRatio;
                canvas.height = canvas.clientHeight * window.devicePixelRatio;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                
                // Magical "Fade" - creating the neon trail effect
                ctx.fillStyle = 'rgba(0,0,0,0.05)'; 
                ctx.fillRect(0,0,canvas.width,canvas.height);

                const colors = PALETTES[state.emo];
                const factor = state.int / 100;
                const speed = 0.005 + (factor * 0.02);

                // Hidden Data Cipher (Discrete dots in bottom corner)
                ctx.fillStyle = colors[0];
                const intentIdx = EMOJIS.indexOf(state.intent) + 1;
                for(let j=0; j<intentIdx; j++) ctx.fillRect(40+(j*10), canvas.height-40, 4, 4);

                // Particle Loop
                const count = 50;
                ctx.shadowBlur = 15 * factor;
                ctx.lineWidth = 1.5 + (factor * 3);

                for(let i=0; i < count; i++) {
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.shadowColor = colors[i % colors.length];
                    ctx.beginPath();
                    
                    let x, y;
                    const p = (i / count) * Math.PI * 2;
                    
                    if(state.emo === 'serenity') {
                        // Harmonograph: Silk Weaving
                        x = cx + Math.sin(t * 1.1 + p * 2) * cx * 0.8 * factor;
                        y = cy + Math.cos(t * 0.9 + p * 3) * cy * 0.8 * factor;
                    } else if(state.emo === 'joy') {
                        // Flower of Life / Spirograph
                        const r = (cx * 0.5 * factor) * Math.sin(t + p * 5);
                        x = cx + Math.cos(p + t) * (r + 100);
                        y = cy + Math.sin(p + t) * (r + 100);
                    } else if(state.emo === 'rage') {
                        // Lightning / Chaotic Energy
                        x = cx + Math.tan(Math.sin(t + p)) * cx * factor;
                        y = cy + Math.cos(t * 5 + p) * cy * factor;
                    } else {
                        // Dark Matter / Gravity Wells
                        const d = (Math.sin(t + p) * 150) * factor;
                        x = cx + Math.cos(p) * (200 - d);
                        y = cy + Math.sin(p) * (200 - d);
                    }

                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.stroke();
                }

                t += speed;
                requestAnimationFrame(draw);
            }
            draw();
        }

        // CRYSTAL CRYPTO (Fixed Buffer)
        const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
        const d64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

        async function handleEnc() {
            const pass = document.getElementById('pass-en').value;
            if(!pass) return alert("Define a Key");
            const data = new TextEncoder().encode(JSON.stringify(state));
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const kMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:10000, hash:"SHA-256"}, kMat, {name:"AES-GCM", length:256}, false, ["encrypt"]);
            const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
            const pack = { c: b64(cipher), s: b64(salt), v: b64(iv) };
            document.getElementById('final-link').value = window.location.origin + window.location.pathname + '#' + encodeURIComponent(btoa(JSON.stringify(pack)));
            document.getElementById('result-area').style.display = 'block';
        }

        async function handleDec() {
            try {
                const pass = document.getElementById('pass-de').value;
                const pack = JSON.parse(atob(decodeURIComponent(window.location.hash.substring(1))));
                const kMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
                const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:d64(pack.s), iterations:10000, hash:"SHA-256"}, kMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
                const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv:d64(pack.v)}, key, d64(pack.c));
                state = JSON.parse(new TextDecoder().decode(dec));
                document.getElementById('dec-input').style.display = 'none';
                document.getElementById('dec-output').style.display = 'flex';
                document.getElementById('res-emo').innerText = state.emo.toUpperCase();
                document.getElementById('res-int').innerText = state.intent;
                runAnim('view-canvas');
            } catch(e) { alert("Key Incorrect"); }
        }

        document.getElementById('do-encrypt').onclick = handleEnc;
        document.getElementById('do-decrypt').onclick = handleDec;
        document.getElementById('copy-btn').onclick = () => { document.getElementById('final-link').select(); document.execCommand('copy'); alert("Link Synthesized"); };

        runAnim('preview-canvas');
        if(window.location.hash) switchView('decrypt');
    </script>
</body>
</html>
