<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentSpeak | Visual Cipher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-mesh"></div>

    <header class="main-nav">
        <div class="logo-area" onclick="location.hash=''; location.reload();">
            <span class="logo-icon">🌐</span>
            <h1>SilentSpeak</h1>
        </div>
        <button id="btn-open-key" class="icon-btn-circle">🔑</button>
    </header>

    <div class="app-container">
        <section id="view-create" class="view active">
            <div class="canvas-wrapper">
                <span class="label-floating">Live Preview</span>
                <canvas id="preview-canvas"></canvas>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label>Emotion</label>
                    <div class="selector-grid">
                        <button class="emotion-btn selected" data-emotion="serenity">🌊</button>
                        <button class="emotion-btn" data-emotion="joy">✨</button>
                        <button class="emotion-btn" data-emotion="rage">🔥</button>
                        <button class="emotion-btn" data-emotion="grief">🌑</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>Intent Cipher</label>
                    <div class="selector-grid">
                        <button class="intent-btn" data-intent="MEET">🤝</button>
                        <button class="intent-btn" data-intent="OK">👌</button>
                        <button class="intent-btn" data-intent="HELP">🆘</button>
                        <button class="intent-btn" data-intent="SAFE">🏠</button>
                        <button class="intent-btn" data-intent="WAIT">⏳</button>
                        <button class="intent-btn" data-intent="CALL">📞</button>
                        <button class="intent-btn" data-intent="FOOD">🍕</button>
                        <button class="intent-btn" data-intent="SLEEP">😴</button>
                    </div>
                </div>

                <div class="control-row">
                    <div class="control-group">
                        <label>Intensity: <span id="intensity-val">50%</span></label>
                        <input type="range" id="intensity" min="0" max="100" value="50">
                    </div>
                </div>
            </div>
            <button id="btn-goto-encrypt" class="primary-btn">Next: Encrypt →</button>
        </section>

        <section id="view-encrypt" class="view hidden">
            <h2>Secure Message</h2>
            <input type="password" id="encrypt-pass" placeholder="Enter Passphrase">
            <button id="btn-encrypt" class="primary-btn">🔒 Generate Link</button>
            <div id="share-result" class="hidden">
                <input type="text" id="share-link" readonly>
                <button id="btn-copy" class="secondary-btn">Copy Link</button>
            </div>
        </section>

        <section id="view-decrypt" class="view hidden">
            <div id="decrypt-input-area">
                <h2>Unlock Message</h2>
                <input type="password" id="decrypt-pass" placeholder="Passphrase">
                <button id="btn-decrypt" class="primary-btn">🔓 Decrypt</button>
            </div>
            <div id="decrypt-display-area" class="hidden">
                <div class="canvas-wrapper"><canvas id="view-canvas"></canvas></div>
                <div class="summary-card">
                    <p>Emotion: <span id="res-emotion"></span></p>
                    <p>Intent: <span id="res-intent"></span></p>
                </div>
            </div>
        </section>
    </div>

    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>
</html>
