<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentSpeak | Supernova</title>
    <style>
        :root { --bg: #000; --accent: #fff; --surface: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Arial Black', sans-serif; margin: 0; overflow: hidden; }
        .app-container { max-width: 500px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
        
        /* The Preview Window */
        .canvas-wrapper { width: 100%; flex-grow: 1; background: #000; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }

        /* UI Overlay */
        .controls { background: rgba(10, 10, 10, 0.9); padding: 20px; border-top: 2px solid #222; backdrop-filter: blur(10px); }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 80px; overflow-y: auto; margin-bottom: 10px; }
        
        button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
        button.selected { border-color: #fff; background: #fff; color: #000; box-shadow: 0 0 20px #fff; }
        
        .primary-btn { width: 100%; background: #00ffcc; color: #000; font-weight: 900; padding: 20px; border: none; border-radius: 12px; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; }
        
        input { width: 100%; padding: 15px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; margin-bottom: 10px; }
        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
        .summary-card { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; }
        .big-text { font-size: 3rem; text-shadow: 0 0 20px #000; }
    </style>
</head>
<body>

    <div class="app-container">
        <section id="view-create" class="view active">
            <div class="canvas-wrapper">
                <canvas id="preview-canvas"></canvas>
            </div>
            <div class="controls">
                <div class="grid">
                    <button class="emo-btn selected" data-emo="serenity">🌊</button>
                    <button class="emo-btn" data-emo="joy">✨</button>
                    <button class="emo-btn" data-emo="rage">🔥</button>
                    <button class="emo-btn" data-emo="grief">🌑</button>
                </div>
                <div class="emoji-grid" id="intent-picker"></div>
                <input type="range" id="intensity" min="1" max="100" value="70" style="width:100%; accent-color:#00ffcc">
                <button id="goto-encrypt" class="primary-btn">ENCODE & LOCK</button>
            </div>
        </section>

        <section id="view-encrypt" class="view">
            <div class="controls" style="margin-top:auto;">
                <h1 style="text-align:center">Set Passphrase</h1>
                <input type="text" id="pass-en" placeholder="PASSWORD">
                <button id="do-encrypt" class="primary-btn">GENERATE SECURE URL</button>
                <div id="result-area" style="display:none; margin-top:20px;">
                    <input type="text" id="final-link" readonly>
                    <button id="copy-btn" style="width:100%; background:#fff; color:#000">COPY LINK</button>
                </div>
                <button onclick="switchView('create')" style="width:100%; background:none; border:none; color:#666; margin-top:15px;">← CANCEL</button>
            </div>
        </section>

        <section id="view-decrypt" class="view">
            <div id="dec-input" class="controls" style="margin-top:auto;">
                <h1 style="text-align:center">Unlock Visual</h1>
                <input type="text" id="pass-de" placeholder="ENTER KEY">
                <button id="do-decrypt" class="primary-btn">DECODE</button>
            </div>
            <div id="dec-output" style="display:none; height:100%; flex-direction:column;">
                <div class="canvas-wrapper">
                    <canvas id="view-canvas"></canvas>
                    <div class="summary-card">
                        <span id="res-emo" class="big-text"></span>
                        <span id="res-int" class="big-text"></span>
                    </div>
                </div>
                <button onclick="location.hash=''; location.reload();" class="primary-btn" style="border-radius:0;">CREATE NEW</button>
            </div>
        </section>
    </div>

    <script>
        const EMOJIS = ["🤝","👌","🆘","🏠","⏳","📞","🍕","😴","❤️","🏃","🚨","🎁","🫂","✅","❓","⚠️","🕊️","💪","🌈","📍","🔒","💰","🔥","🧊","💊","💬","💀","🤫","👀","🥂","🦋","🛸","🌌","🧬","🌹","💎"];
        let state = { emo:'serenity', int:70, intent:'🤝', seed:Math.random() };

        // UI Setup
        const picker = document.getElementById('intent-picker');
        EMOJIS.forEach(e => {
            const b = document.createElement('button');
            b.innerText = e;
            b.onclick = () => {
                document.querySelectorAll('#intent-picker button').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                state.intent = e;
            };
            if(e === '🤝') b.classList.add('selected');
            picker.appendChild(b);
        });

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        }

        document.querySelectorAll('.emo-btn').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.emo-btn').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                state.emo = b.dataset.emo;
            }
        });

        document.getElementById('intensity').oninput = (e) => state.int = e.target.value;
        document.getElementById('goto-encrypt').onclick = () => switchView('encrypt');

        // FLASHY ANIMATION ENGINE
        function runAnim(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let t = 0;

            function draw() {
                if (canvas.offsetParent === null) return requestAnimationFrame(draw);
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
                const w = canvas.width;
                const h = canvas.height;
                
                // Subtractive clear for trails
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0,0,w,h);

                const factor = state.int / 100;
                const hueShift = t * 50; // Dynamic color cycling

                // Intent Cipher (Bottom hidden marks)
                ctx.fillStyle = `hsl(${hueShift}, 100%, 50%)`;
                const intentIdx = EMOJIS.indexOf(state.intent) + 1;
                for(let j=0; j<intentIdx; j++) ctx.fillRect(20+(j*6), h-10, 4, 4);

                ctx.lineWidth = 2;
                const lines = 30 + (factor * 50);

                for(let i=0; i<lines; i++) {
                    ctx.beginPath();
                    // Rainbow colors based on line index and time
                    ctx.strokeStyle = `hsl(${(i * 5) + hueShift}, 100%, 60%)`;
                    
                    let x1, y1, x2, y2;
                    const angle = (i / lines) * Math.PI * 2;
                    const dist = (w < h ? w : h) * 0.45 * factor;

                    if(state.emo === 'serenity') {
                        // Weaving Silk Waves
                        x1 = w/2 + Math.sin(t + angle) * dist;
                        y1 = h/2 + Math.cos(t * 0.5 + angle) * dist;
                        x2 = w/2 + Math.cos(t * 0.2 + angle * 2) * (dist * 1.5);
                        y2 = h/2 + Math.sin(t + angle) * (dist * 1.5);
                    } else if(state.emo === 'joy') {
                        // Exploding Star
                        x1 = w/2 + Math.cos(angle + t) * (dist * 0.2);
                        y1 = h/2 + Math.sin(angle + t) * (dist * 0.2);
                        x2 = w/2 + Math.cos(angle - t * 2) * (dist * 2);
                        y2 = h/2 + Math.sin(angle - t * 2) * (dist * 2);
                    } else if(state.emo === 'rage') {
                        // Jagged Lightning
                        x1 = Math.random() * w;
                        y1 = Math.random() * h;
                        x2 = x1 + (Math.random() - 0.5) * 200 * factor;
                        y2 = y1 + (Math.random() - 0.5) * 200 * factor;
                    } else {
                        // Deep Tunnel
                        const r = (i * 10) % (dist * 2);
                        ctx.arc(w/2, h/2, r, 0, Math.PI * 2);
                    }

                    if(state.emo !== 'grief') {
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                    }
                    ctx.stroke();
                }

                t += 0.01;
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Crypto
        const b64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
        const d64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

        async function handleEnc() {
            const pass = document.getElementById('pass-en').value;
            if(!pass) return alert("ENTER PASSWORD");
            const data = new TextEncoder().encode(JSON.stringify(state));
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const kMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:10000, hash:"SHA-256"}, kMat, {name:"AES-GCM", length:256}, false, ["encrypt"]);
            const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
            const pack = { c: b64(cipher), s: b64(salt), v: b64(iv) };
            document.getElementById('final-link').value = window.location.origin + window.location.pathname + '#' + encodeURIComponent(btoa(JSON.stringify(pack)));
            document.getElementById('result-area').style.display = 'block';
        }

        async function handleDec() {
            try {
                const pass = document.getElementById('pass-de').value;
                const pack = JSON.parse(atob(decodeURIComponent(window.location.hash.substring(1))));
                const kMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
                const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:d64(pack.s), iterations:10000, hash:"SHA-256"}, kMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
                const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv:d64(pack.v)}, key, d64(pack.c));
                state = JSON.parse(new TextDecoder().decode(dec));
                document.getElementById('dec-input').style.display = 'none';
                document.getElementById('dec-output').style.display = 'flex';
                document.getElementById('res-emo').innerText = state.emo.toUpperCase();
                document.getElementById('res-int').innerText = state.intent;
                runAnim('view-canvas');
            } catch(e) { alert("WRONG KEY"); }
        }

        document.getElementById('do-encrypt').onclick = handleEnc;
        document.getElementById('do-decrypt').onclick = handleDec;
        document.getElementById('copy-btn').onclick = () => { document.getElementById('final-link').select(); document.execCommand('copy'); alert("LINK COPIED"); };

        runAnim('preview-canvas');
        if(window.location.hash) switchView('decrypt');
    </script>
</body>
</html>
