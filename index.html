<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentSpeak | Visual Cipher</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --bg: #050505; --accent: #00ff9d; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .app-container { max-width: 450px; margin: auto; padding: 20px; width: 100%; box-sizing: border-box; }
        .canvas-wrapper { width: 100%; height: 320px; background: #000; border: 1px solid #222; border-radius: 16px; margin-bottom: 20px; position: relative; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        .view { display: none; }
        .view.active { display: block; }
        .selector-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        button { background: #151515; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; font-size: 1.2rem; }
        button.selected { border-color: var(--accent); background: rgba(0,255,157,0.1); transform: scale(1.05); }
        .primary-btn { width: 100%; background: var(--accent); color: #000; font-weight: bold; padding: 16px; border: none; border-radius: 12px; margin-top: 10px; cursor: pointer; }
        input[type="password"], input[type="text"] { width: 100%; padding: 14px; background: #111; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; margin-bottom: 12px; }
        .hidden { display: none !important; }
        label { font-size: 0.7rem; color: #666; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>
    <header style="padding: 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;">
        <h1 style="font-size: 1rem; margin: 0; letter-spacing: 2px;">SILENTSPEAK</h1>
        <button id="btn-open-key" style="font-size: 1rem; padding: 5px 10px;">🔑 KEY</button>
    </header>

    <div class="app-container">
        <section id="view-create" class="view active">
            <div class="canvas-wrapper"><canvas id="preview-canvas"></canvas></div>
            <label>1. Select Emotion</label>
            <div class="selector-grid">
                <button class="emotion-btn selected" data-emotion="serenity">🌊</button>
                <button class="emotion-btn" data-emotion="joy">✨</button>
                <button class="emotion-btn" data-emotion="rage">🔥</button>
                <button class="emotion-btn" data-emotion="grief">🌑</button>
            </div>
            <label>2. Intent Cipher</label>
            <div class="selector-grid" id="intent-grid">
                <button class="intent-btn" data-intent="MEET">🤝</button>
                <button class="intent-btn" data-intent="OK">👌</button>
                <button class="intent-btn" data-intent="HELP">🆘</button>
                <button class="intent-btn" data-intent="SAFE">🏠</button>
                <button class="intent-btn" data-intent="WAIT">⏳</button>
                <button class="intent-btn" data-intent="CALL">📞</button>
                <button class="intent-btn" data-intent="FOOD">🍕</button>
                <button class="intent-btn" data-intent="SLEEP">😴</button>
            </div>
            <label>3. Intensity: <span id="intensity-val" style="color:var(--accent)">50%</span></label>
            <input type="range" id="intensity" min="1" max="100" value="50" style="width:100%; accent-color:var(--accent); margin-bottom:20px;">
            <button id="btn-goto-encrypt" class="primary-btn">GENERATE SECURE LINK →</button>
        </section>

        <section id="view-encrypt" class="view">
            <button id="btn-back-create" style="font-size: 0.8rem; margin-bottom: 20px;">← BACK</button>
            <h2>Encrypt Message</h2>
            <input type="password" id="encrypt-pass" placeholder="Create a Passphrase">
            <button id="btn-encrypt" class="primary-btn">🔒 CREATE LINK</button>
            <div id="share-result" class="hidden" style="margin-top: 25px; padding: 20px; background: #111; border-radius: 12px; border: 1px solid #222;">
                <label>Secure URL</label>
                <input type="text" id="share-link" readonly>
                <button id="btn-copy" style="width: 100%; background: #333; font-size: 0.9rem;">COPY LINK</button>
            </div>
        </section>

        <section id="view-decrypt" class="view">
            <div id="decrypt-input-area">
                <h2>Unlock Message</h2>
                <input type="password" id="decrypt-pass" placeholder="Enter Passphrase">
                <button id="btn-decrypt" class="primary-btn">🔓 DECRYPT</button>
            </div>
            <div id="decrypt-display-area" class="hidden">
                <div class="canvas-wrapper"><canvas id="view-canvas"></canvas></div>
                <div style="background: #111; padding: 20px; border-radius: 12px; border: 1px solid #222;">
                    <label>Decoded Meaning</label>
                    <div style="display: flex; justify-content: space-around; font-size: 2rem; margin-top: 10px;">
                        <span id="res-emotion"></span>
                        <span id="res-intent"></span>
                    </div>
                </div>
                <button onclick="location.hash=''; location.reload();" class="primary-btn" style="background: #222; color: #fff; margin-top: 20px;">CREATE NEW</button>
            </div>
        </section>
    </div>

    <div id="modal-key" class="view" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:100; padding:40px; text-align:center;">
        <h2>Visual Key</h2>
        <div style="text-align:left; max-width:300px; margin:auto; line-height:2;">
            <p>🌊 <b>Serenity:</b> Calm, flowing paths.</p>
            <p>✨ <b>Joy:</b> Bouncing, circular orbits.</p>
            <p>🔥 <b>Rage:</b> High-speed jittery triangles.</p>
            <p>🌑 <b>Grief:</b> Slow, heavy falling orbs.</p>
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <p>🆔 <b>Intent:</b> Small squares in bottom-left.</p>
        </div>
        <button onclick="document.getElementById('modal-key').style.display='none'" class="primary-btn">CLOSE</button>
    </div>

    <div id="toast-container" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);"></div>
    <script src="app.js"></script>
</body>
</html>
