<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilentSpeak | Hypnotic Cipher</title>
    <style>
        :root { --bg: #050505; --accent: #00ff9d; --surface: #111; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        .app-container { max-width: 450px; margin: 0 auto; padding: 15px; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; letter-spacing: 2px; }
        
        .canvas-wrapper { width: 100%; flex-grow: 1; min-height: 350px; background: #000; border-radius: 20px; border: 1px solid #222; margin-bottom: 15px; position: relative; box-shadow: 0 0 30px rgba(0,255,157,0.05); }
        canvas { width: 100%; height: 100%; display: block; border-radius: 20px; }

        .controls { background: var(--surface); padding: 15px; border-radius: 20px; border: 1px solid #222; }
        .section-label { font-size: 0.6rem; color: #555; text-transform: uppercase; margin: 10px 0; letter-spacing: 1px; }
        
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-height: 100px; overflow-y: auto; padding: 5px; }
        
        button { background: #000; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        button.selected { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,255,157,0.2); transform: scale(1.05); }
        
        .primary-btn { width: 100%; background: var(--accent); color: #000; font-weight: bold; padding: 16px; border: none; border-radius: 15px; margin-top: 15px; font-size: 1rem; cursor: pointer; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; margin-bottom: 10px; }
        
        .view { display: none; height: 100%; flex-direction: column; }
        .view.active { display: flex; }
        .hidden { display: none !important; }
        .summary-card { display: flex; justify-content: space-around; background: #000; padding: 20px; border-radius: 15px; margin-top: 10px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <header>
        <div onclick="location.hash=''; location.reload();" style="cursor:pointer"><b>SILENT_SPEAK</b></div>
        <div id="status-dot" style="width:8px; height:8px; background:var(--accent); border-radius:50%; box-shadow:0 0 10px var(--accent);"></div>
    </header>

    <div class="app-container">
        <section id="view-create" class="view active">
            <div class="canvas-wrapper"><canvas id="preview-canvas"></canvas></div>
            
            <div class="controls">
                <span class="section-label">Vibe Selection</span>
                <div class="grid">
                    <button class="emo-btn selected" data-emo="serenity">🌊</button>
                    <button class="emo-btn" data-emo="joy">✨</button>
                    <button class="emo-btn" data-emo="rage">🔥</button>
                    <button class="emo-btn" data-emo="grief">🌑</button>
                </div>

                <span class="section-label">Intent Symbol</span>
                <div class="emoji-grid" id="intent-picker"></div>

                <input type="range" id="intensity" min="1" max="100" value="50" style="width:100%; accent-color:var(--accent); margin-top:15px;">
            </div>
            <button id="goto-encrypt" class="primary-btn">ENCODE MESSAGE</button>
        </section>

        <section id="view-encrypt" class="view">
            <button onclick="switchView('create')" style="background:none; border:none; color:#555; text-align:left; padding:0; margin-bottom:20px;">← RETURN TO CANVAS</button>
            <div class="controls">
                <h2>Secure Link</h2>
                <input type="text" id="pass-en" placeholder="Passphrase (e.g. 'blue')">
                <button id="do-encrypt" class="primary-btn">GENERATE CIPHER</button>
                <div id="result-area" class="hidden">
                    <input type="text" id="final-link" readonly style="margin-top:20px; font-family:monospace; font-size:0.7rem;">
                    <button id="copy-btn" style="width:100%; font-size:0.9rem; background:#222;">COPY TO CLIPBOARD</button>
                </div>
            </div>
        </section>

        <section id="view-decrypt" class="view">
            <div id="dec-input" class="controls" style="margin-top:50px;">
                <h2>Encrypted Stream</h2>
                <input type="text" id="pass-de" placeholder="Enter Key">
                <button id="do-decrypt" class="primary-btn">DECODE</button>
            </div>
            <div id="dec-output" class="hidden" style="height:100%; display:flex; flex-direction:column;">
                <div class="canvas-wrapper"><canvas id="view-canvas"></canvas></div>
                <div class="summary-card">
                    <span id="res-emo"></span>
                    <span id="res-int" style="font-size:2.5rem"></span>
                </div>
                <button onclick="location.hash=''; location.reload();" class="primary-btn" style="background:#111; color:#fff;">NEW CIPHER</button>
            </div>
        </section>
    </div>

    <script>
        const EMOJIS = ["🤝","👌","🆘","🏠","⏳","📞","🍕","😴","❤️","🏃","🚨","🎁","🫂","✅","❓","⚠️","🕊️","💪","🌈","📍","🔒","💰","🔥","🧊","💊","💬","💀","🤫","👀","🥂","🦋","🛸","🌌","🧬"];
        const PALETTES = { 
            serenity:['#00f2ff','#7effd4','#0062ff'], 
            joy:['#fff000','#ff00d4','#00ff9d'], 
            rage:['#ff4800','#ff0000','#fff'], 
            grief:['#4e008a','#111','#555'] 
        };
        
        let state = { emo:'serenity', int:50, intent:'🤝', seed:Math.random() };

        // Emoji Init
        const picker = document.getElementById('intent-picker');
        EMOJIS.forEach(e => {
            const b = document.createElement('button');
            b.innerText = e;
            b.onclick = () => {
                document.querySelectorAll('#intent-picker button').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                state.intent = e;
            };
            if(e === '🤝') b.classList.add('selected');
            picker.appendChild(b);
        });

        function switchView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
        }

        document.querySelectorAll('.emo-btn').forEach(b => {
            b.onclick = () => {
                document.querySelectorAll('.emo-btn').forEach(btn => btn.classList.remove('selected'));
                b.classList.add('selected');
                state.emo = b.dataset.emo;
            }
        });

        document.getElementById('intensity').oninput = (e) => state.int = e.target.value;
        document.getElementById('goto-encrypt').onclick = () => switchView('encrypt');

        // Mesmerizing Animation Engine
        function runAnim(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            let t = 0;

            function draw() {
                canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                
                // Ghosting Effect (Mesmerizing Trails)
                ctx.fillStyle = 'rgba(0,0,0,0.08)'; 
                ctx.fillRect(0,0,canvas.width,canvas.height);

                const colors = PALETTES[state.emo];
                const factor = state.int / 100;
                
                // Draw Intent Hidden Cipher
                ctx.fillStyle = colors[0];
                const intentIdx = EMOJIS.indexOf(state.intent) + 1;
                for(let j=0; j<intentIdx; j++) ctx.fillRect(20+(j*4), canvas.height-20, 2, 2);

                // Geometric Emotion Math
                const count = 40;
                for(let i=0; i < count; i++) {
                    ctx.strokeStyle = colors[i % colors.length];
                    ctx.lineWidth = 1 + factor * 2;
                    ctx.beginPath();
                    
                    let x, y;
                    const angle = (i / count) * Math.PI * 2 + t;
                    
                    if(state.emo === 'serenity') {
                        // Lissajous Curve
                        x = cx + Math.sin(angle * 2 + t) * (120 * factor + 20);
                        y = cy + Math.cos(angle * 3 + t * 0.5) * (120 * factor + 20);
                    } else if(state.emo === 'joy') {
                        // Expanding Spiral
                        const r = (20 + i * 4) * factor + Math.sin(t*2)*20;
                        x = cx + Math.cos(angle + t) * r;
                        y = cy + Math.sin(angle + t) * r;
                    } else if(state.emo === 'rage') {
                        // Fractal Glitch
                        x = cx + (Math.random() - 0.5) * canvas.width * factor;
                        y = cy + (Math.random() - 0.5) * canvas.height * factor;
                    } else {
                        // Heavy Rainfall
                        x = (canvas.width / count) * i;
                        y = (t * 200 + i * 100) % canvas.height;
                    }

                    ctx.arc(x, y, 2 + factor * 5, 0, Math.PI * 2);
                    ctx.stroke();
                }

                t += 0.01 + (factor * 0.02);
                requestAnimationFrame(draw);
            }
            draw();
        }

        // Crypto
        const buffToB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
        const b64ToBuff = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

        async function handleEnc() {
            const pass = document.getElementById('pass-en').value;
            if(!pass) return alert("Enter Key");
            const data = new TextEncoder().encode(JSON.stringify(state));
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
            const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:10000, hash:"SHA-256"}, keyMat, {name:"AES-GCM", length:256}, false, ["encrypt"]);
            const cipher = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, data);
            const pack = { c: buffToB64(cipher), s: buffToB64(salt), v: buffToB64(iv) };
            document.getElementById('final-link').value = window.location.origin + window.location.pathname + '#' + encodeURIComponent(btoa(JSON.stringify(pack)));
            document.getElementById('result-area').classList.remove('hidden');
        }

        async function handleDec() {
            try {
                const pass = document.getElementById('pass-de').value;
                const pack = JSON.parse(atob(decodeURIComponent(window.location.hash.substring(1))));
                const keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
                const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64ToBuff(pack.s), iterations:10000, hash:"SHA-256"}, keyMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
                const dec = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBuff(pack.v)}, key, b64ToBuff(pack.c));
                state = JSON.parse(new TextDecoder().decode(dec));
                document.getElementById('dec-input').classList.add('hidden');
                document.getElementById('dec-output').style.display = 'flex';
                document.getElementById('res-emo').innerText = {serenity:'SERENITY', joy:'JOY', rage:'RAGE', grief:'GRIEF'}[state.emo];
                document.getElementById('res-int').innerText = state.intent;
                runAnim('view-canvas');
            } catch(e) { alert("Wrong Key"); }
        }

        document.getElementById('do-encrypt').onclick = handleEnc;
        document.getElementById('do-decrypt').onclick = handleDec;
        document.getElementById('copy-btn').onclick = () => { document.getElementById('final-link').select(); document.execCommand('copy'); alert("Cipher Copied"); };

        runAnim('preview-canvas');
        if(window.location.hash) switchView('decrypt');
    </script>
</body>
</html>
